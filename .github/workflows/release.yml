# Build Windows Store packages, create a GitHub Release, and submit to Partner Center.
#
# Trigger: Actions → "Release build" → Run workflow, or push tag v* (e.g. v2.7.7).
# Manual inputs:
#   create_github_release   — create GitHub Release from changelog.md (default: true)
#   submit_microsoft_store  — submit MSIX to Partner Center (default: true)
# Tag pushes always create a GitHub Release and submit to the Store.
#
# Before shipping: bump version, add ## vX.Y.Z to changelog.md, commit to main.
# Store CI setup: docs/microsoft-store-ci.md
#
# ── Windows Store package identity (same as local .env) ──
#   WINDOWS_IDENTITY_NAME
#   WINDOWS_PUBLISHER
#   WINDOWS_PUBLISHER_DISPLAY_NAME
#
# ── Microsoft Store Partner Center submit (see docs/microsoft-store-ci.md) ──
#   AZURE_AD_TENANT_ID
#   AZURE_AD_APPLICATION_CLIENT_ID
#   AZURE_AD_APPLICATION_SECRET
#   SELLER_ID
#   MS_STORE_PRODUCT_ID
#
# Reuse the same Entra app as ReDD Blocker if it already has Manager on the
# Partner Center account — only MS_STORE_PRODUCT_ID must be To-Do’s Store ID.
# Repo: ulyngs/redd-todo (git remote may still say redd-task; that redirects).

name: Release build

on:
  workflow_dispatch:
    inputs:
      create_github_release:
        description: Create a GitHub Release (notes from changelog.md)
        type: boolean
        default: true
      submit_microsoft_store:
        description: Submit Store MSIX to Partner Center (What's new from changelog)
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  build-windows-store:
    name: Windows Store (.msix)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Microsoft Store packages
        shell: pwsh
        env:
          WINDOWS_IDENTITY_NAME: ${{ secrets.WINDOWS_IDENTITY_NAME }}
          WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
          WINDOWS_PUBLISHER_DISPLAY_NAME: ${{ secrets.WINDOWS_PUBLISHER_DISPLAY_NAME }}
        run: npm run build:win-store

      - name: Upload Windows Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-store-packages
          path: |
            for-distribution/x86_64-pc-windows-msvc/*.msix
            for-distribution/x86_64-pc-windows-msvc/nsis/**
            for-distribution/x86_64-pc-windows-msvc/msi/**
          if-no-files-found: error
          retention-days: 30

  publish-microsoft-store:
    name: Publish (Microsoft Store)
    needs: [build-windows-store]
    runs-on: windows-latest
    timeout-minutes: 60
    if: >-
      needs.build-windows-store.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'workflow_dispatch' && inputs.submit_microsoft_store)
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require Partner Center secrets
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          MS_STORE_PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
        run: |
          $missing = @()
          foreach ($name in @(
            'AZURE_AD_TENANT_ID',
            'AZURE_AD_APPLICATION_CLIENT_ID',
            'AZURE_AD_APPLICATION_SECRET',
            'SELLER_ID',
            'MS_STORE_PRODUCT_ID'
          )) {
            if (-not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { continue }
            $missing += $name
          }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub secrets for Store submit: $($missing -join ', '). See docs/microsoft-store-ci.md — set these once, or uncheck submit_microsoft_store on manual runs."
          }

      - name: Download Windows Store artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-store-packages
          path: store-packages

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build What's new from changelog
        shell: bash
        run: |
          node scripts/changelog-to-store-whats-new.js "${{ steps.meta.outputs.version }}" --out whats_new.txt
          echo "=== What's new ==="
          cat whats_new.txt

      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.3

      - name: Submit to Partner Center
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          MS_STORE_PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
          PYTHONUTF8: '1'
        run: |
          ./scripts/submit-microsoft-store.ps1 `
            -PackagesDir store-packages `
            -WhatsNewFile whats_new.txt `
            -ProductId $env:MS_STORE_PRODUCT_ID `
            -Reconfigure

  publish-github-release:
    name: Publish (GitHub Release)
    needs: [build-windows-store]
    runs-on: ubuntu-latest
    if: >-
      needs.build-windows-store.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'workflow_dispatch' && inputs.create_github_release)
      )
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-store-packages
          path: artifacts

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p for-distribution
          # Flatten MSIX + any NSIS/MSI setupers to for-distribution/
          find artifacts -type f \( -name '*.msix' -o -name '*.exe' -o -name '*.msi' \) \
            -exec cp -n {} for-distribution/ \;
          echo "Staged:"
          ls -la for-distribution

      - name: Resolve version and tag
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from changelog
        run: |
          bash ./scripts/extract-changelog-section.sh "${{ steps.meta.outputs.version }}" > release-notes.md
          echo "Release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ReDD To-Do ${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          files: |
            for-distribution/ReDD-To-Do_*.msix
            for-distribution/*.exe
            for-distribution/*.msi
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: false
