# Re-submit existing Store .msix packages to Partner Center without rebuilding.
#
# Use after a Release already published .msix assets (or to retry a failed
# Publish (Microsoft Store) job with fixed submit scripts on main).
#
# Actions → "Microsoft store submission" → Run workflow → set release_tag (e.g. v2.7.8).

name: Microsoft store submission

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release tag whose .msix assets to submit (e.g. v2.7.8)
        required: true
        type: string

concurrency:
  group: store-submit-${{ inputs.release_tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit-microsoft-store:
    name: Submit to Partner Center
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Require Partner Center secrets
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          MS_STORE_PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
        run: |
          $missing = @()
          foreach ($name in @(
            'AZURE_AD_TENANT_ID',
            'AZURE_AD_APPLICATION_CLIENT_ID',
            'AZURE_AD_APPLICATION_SECRET',
            'SELLER_ID',
            'MS_STORE_PRODUCT_ID'
          )) {
            if (-not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { continue }
            $missing += $name
          }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub secrets for Store submit: $($missing -join ', '). See docs/microsoft-store-ci.md."
          }

      - name: Download MSIX from GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$(echo -n "$RELEASE_TAG" | tr -d '[:space:]')"
          if [[ -z "$TAG" ]]; then
            echo "release_tag input is empty" >&2
            exit 1
          fi
          if [[ "$TAG" != v* ]]; then
            TAG="v${TAG}"
            echo "Normalized release tag to $TAG"
          fi
          mkdir -p store-packages
          if ! gh release download "$TAG" \
            --repo "$GH_REPO" \
            --pattern '*.msix' \
            --dir store-packages \
            --clobber; then
            echo "Failed to download release $TAG. Recent releases:" >&2
            gh release list --repo "$GH_REPO" --limit 8 >&2 || true
            exit 1
          fi
          echo "Downloaded:"
          find store-packages -type f -name '*.msix' -print
          count="$(find store-packages -type f -name '*.msix' | wc -l | tr -d ' ')"
          if [[ "$count" -lt 1 ]]; then
            echo "No .msix assets on release $TAG" >&2
            exit 1
          fi

      - name: Resolve version
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="$(echo -n "$RELEASE_TAG" | tr -d '[:space:]')"
          TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "$PKG" ]]; then
            echo "Warning: release tag version ($TAG) != package.json ($PKG); using tag for What's new." >&2
          fi
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build What's new from changelog
        shell: bash
        run: |
          node scripts/changelog-to-store-whats-new.js "${{ steps.meta.outputs.version }}" --platform windows --out whats_new.txt
          echo "=== What's new ==="
          cat whats_new.txt

      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.3

      - name: Submit to Partner Center
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          MS_STORE_PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
          PYTHONUTF8: '1'
        run: |
          ./scripts/submit-microsoft-store.ps1 `
            -PackagesDir store-packages `
            -WhatsNewFile whats_new.txt `
            -ProductId $env:MS_STORE_PRODUCT_ID `
            -Reconfigure
